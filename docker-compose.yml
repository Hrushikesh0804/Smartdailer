version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smartdialer
      POSTGRES_PASSWORD: smartdialer
      POSTGRES_DB: smartdialer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdialer -d smartdialer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
